<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Premisave Property Console</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231d4ed8'/%3E%3Cpath d='M6 16l10-8 10 8v9H6z' fill='%23ffffff'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f4f5f7;
  --bg-2: #eceef2;
  --panel: #ffffff;
  --panel-2: #f8f9fb;
  --ink: #161a22;
  --muted: #5d6675;
  --line: #e2e5ea;
  --line-2: #cbd0d8;
  --side: #fbfbfc;
  --side-2: #fbfbfc;
  --side-ink: #2b3240;
  --side-muted: #7d8696;
  --brand: #1d4ed8;
  --brand-2: #1740b3;
  --brass: #1d4ed8;
  --brass-soft: #eaf0fe;
  --brass-ink: #1b3fa3;
  --ok: #0c7a43;
  --ok-bg: #e5f4ec;
  --warn: #946200;
  --warn-bg: #fcf1d6;
  --bad: #b3261e;
  --bad-bg: #fce9e7;
  --info: #1d4ed8;
  --info-bg: #eaf0fe;
  --shadow: none;
  --pop: 0 16px 48px rgba(16, 24, 40, .22);
  --sans: "IBM Plex Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --serif: var(--sans);
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
  --radius: 6px;
}
[data-theme="dark"] {
  --bg: #0d1015;
  --bg-2: #12161c;
  --panel: #14181f;
  --panel-2: #191e26;
  --ink: #e7eaf0;
  --muted: #8b94a4;
  --line: #242a34;
  --line-2: #323a47;
  --side: #0a0d11;
  --side-2: #0a0d11;
  --side-ink: #d4d9e2;
  --side-muted: #727b8b;
  --brand: #5b8def;
  --brand-2: #7ca3f5;
  --brass: #6d9bff;
  --brass-soft: #16233f;
  --brass-ink: #a9c3ff;
  --ok: #4cc38a;
  --ok-bg: #11291d;
  --warn: #e3ac45;
  --warn-bg: #2f2410;
  --bad: #f08278;
  --bad-bg: #351816;
  --info: #7ca3f5;
  --info-bg: #16233f;
  --pop: 0 16px 48px rgba(0, 0, 0, .6);
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 13.5px/1.5 var(--sans); -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--brand); text-decoration: none; }
a:hover { text-decoration: underline; }
code, .mono { font-family: var(--mono); font-size: .92em; }
h1, h2, h3 { font-family: var(--sans); font-weight: 600; margin: 0; letter-spacing: -.005em; }
.hidden { display: none !important; }

/* shell */
.app { display: grid; grid-template-columns: 240px 1fr; height: 100vh; }
.side { background: var(--side); color: var(--side-ink); display: flex; flex-direction: column; min-height: 0; border-right: 1px solid var(--line); }
.brandbar { padding: 14px 16px; display: flex; gap: 10px; align-items: center; border-bottom: 1px solid var(--line); }
.crest { width: 28px; height: 28px; border-radius: 6px; background: var(--brand); color: #fff; display: grid; place-items: center; flex: none; }
[data-theme="dark"] .crest { color: #0a0d11; }
.brandbar b { font: 600 14px/1.2 var(--sans); display: block; color: var(--ink); }
.brandbar small { color: var(--side-muted); font-size: 11.5px; }
.nav { overflow: auto; padding: 6px 8px 16px; flex: 1; }
.nav h4 { margin: 16px 8px 4px; font: 600 11.5px/1.2 var(--sans); color: var(--side-muted); }
.nav a { display: flex; align-items: center; gap: 10px; padding: 6px 8px; border-radius: 5px; color: var(--side-ink); cursor: pointer; font-size: 13px; position: relative; }
.nav a:hover { background: var(--bg-2); text-decoration: none; }
.nav a.on { background: var(--brass-soft); color: var(--brass-ink); font-weight: 600; }
.nav a .n { margin-left: auto; font-size: 11px; color: var(--side-muted); font-variant-numeric: tabular-nums; }
.ic { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.sidefoot { padding: 10px 16px; border-top: 1px solid var(--line); font-size: 12px; color: var(--side-muted); }
.main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.top { display: flex; align-items: center; gap: 8px; padding: 8px 20px; background: var(--panel); border-bottom: 1px solid var(--line); flex-wrap: wrap; min-height: 48px; }
.top .grow { flex: 1; }
.menu-btn { display: none; }
.chip { display: inline-flex; align-items: center; gap: 7px; padding: 3px 9px; border-radius: 5px; background: var(--panel); border: 1px solid var(--line); font-size: 12.5px; cursor: pointer; white-space: nowrap; max-width: 100%; }
.chip:hover { border-color: var(--line-2); background: var(--panel-2); }
.chip .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--line-2); flex: none; }
.chip .dot.up { background: var(--ok); }
.chip .dot.down { background: var(--bad); }
.chip .dot.warn { background: var(--warn); }
.chip b { font-weight: 600; }
.chip .lbl { color: var(--muted); }
.ctxbar { display: flex; gap: 6px; padding: 6px 20px; background: var(--panel-2); border-bottom: 1px solid var(--line); overflow-x: auto; align-items: center; }
.ctxbar .lbl { font: 600 11.5px/1 var(--sans); color: var(--muted); margin-right: 4px; flex: none; }
.ctxchip { background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 2px 8px; font-size: 12px; display: inline-flex; gap: 6px; cursor: pointer; flex: none; color: var(--muted); }
.ctxchip:hover { border-color: var(--line-2); }
.ctxchip.set { color: var(--ink); border-color: var(--line-2); }
.ctxchip span { font-family: var(--mono); font-size: 11.5px; color: var(--muted); }
.ctxchip.set span { color: var(--brass-ink); }
.content { overflow: auto; padding: 24px 28px 64px; flex: 1; min-height: 0; }
.wrap { max-width: 1180px; margin: 0 auto; }

/* page header */
.ph { display: flex; align-items: flex-end; gap: 16px; margin-bottom: 18px; flex-wrap: wrap; }
.ph h1 { font-size: 22px; line-height: 1.2; }
.ph p { margin: 6px 0 0; color: var(--muted); max-width: 72ch; }
.ph .grow { flex: 1; min-width: 200px; }
.eyebrow { font: 500 12px/1 var(--sans); color: var(--muted); margin-bottom: 8px; letter-spacing: 0; text-transform: none; }

/* cards and layout */
.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); }
.card > .hd { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-bottom: 1px solid var(--line); flex-wrap: wrap; min-height: 46px; }
.card > .hd h3 { font-size: 14px; }
.card > .hd .sub { color: var(--muted); font-size: 12.5px; }
.card > .bd { padding: 14px; }
.card > .bd.flush { padding: 0; }
.grid { display: grid; gap: 16px; }
.g2 { grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); }
.g3 { grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); }
.stack { display: flex; flex-direction: column; gap: 16px; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.spacer { flex: 1; }
.muted { color: var(--muted); }
.small { font-size: 12.5px; }
.empty { padding: 28px 16px; text-align: center; color: var(--muted); }

/* buttons */
.btn { display: inline-flex; align-items: center; gap: 6px; background: var(--brand); color: #fff; border: 1px solid var(--brand); padding: 6px 12px; border-radius: 5px; cursor: pointer; font-weight: 500; font-size: 13px; white-space: nowrap; }
[data-theme="dark"] .btn { color: #0a0d11; }
.btn:hover { background: var(--brand-2); border-color: var(--brand-2); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn.ghost { background: var(--panel); color: var(--ink); border-color: var(--line-2); }
.btn.ghost:hover { background: var(--panel-2); border-color: var(--muted); }
.btn.brass { background: var(--brand); border-color: var(--brand); color: #fff; }
[data-theme="dark"] .btn.brass { color: #0a0d11; }
.btn.danger { background: var(--panel); color: var(--bad); border-color: var(--line-2); }
.btn.danger:hover { background: var(--bad-bg); border-color: var(--bad); }
.btn.sm { padding: 3px 9px; font-size: 12px; }
.iconbtn { background: transparent; border: 1px solid transparent; border-radius: 5px; padding: 5px; cursor: pointer; color: var(--muted); display: inline-flex; gap: 4px; align-items: center; }
.iconbtn:hover { background: var(--bg-2); color: var(--ink); }

/* forms */
.fld, select.fld, textarea.fld { width: 100%; background: var(--panel); border: 1px solid var(--line-2); border-radius: 5px; padding: 6px 9px; outline: none; }
.fld:focus { border-color: var(--brand); box-shadow: 0 0 0 3px var(--brass-soft); }
textarea.fld { min-height: 70px; resize: vertical; }
.f { margin-bottom: 12px; }
.f > label { display: flex; gap: 6px; align-items: baseline; font-size: 12.5px; font-weight: 500; margin-bottom: 4px; }
.f > label .req { color: var(--bad); }
.f > label .bind { margin-left: auto; font: 400 11px var(--mono); color: var(--muted); }
.f .hint { color: var(--muted); font-size: 12px; margin-top: 3px; }
.fgroup { border: 1px solid var(--line); background: var(--panel-2); border-radius: 5px; padding: 10px 12px 2px; margin-bottom: 12px; }
.fgroup > .gl { font-size: 12px; font-weight: 600; color: var(--muted); margin-bottom: 8px; }
.cols2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 12px; }
.checks { display: flex; gap: 12px; flex-wrap: wrap; }
.checks label { display: inline-flex; gap: 6px; align-items: center; font-weight: 400; }

/* badges */
.badge { display: inline-block; padding: 0 6px; border-radius: 3px; font: 600 10.5px/18px var(--mono); letter-spacing: .02em; text-transform: uppercase; }
.m-GET { background: var(--info-bg); color: var(--info); }
.m-POST { background: var(--ok-bg); color: var(--ok); }
.m-PATCH, .m-PUT { background: var(--warn-bg); color: var(--warn); }
.m-DELETE { background: var(--bad-bg); color: var(--bad); }
.role { background: transparent; color: var(--muted); border: 1px solid var(--line); font-family: var(--sans); text-transform: none; font-weight: 500; font-size: 11.5px; letter-spacing: 0; }
.role.owner, .role.admin { color: var(--ink); border-color: var(--line-2); }
.pill { display: inline-block; padding: 0 7px; border-radius: 3px; font-size: 12px; line-height: 20px; font-weight: 500; background: var(--bg-2); border: 1px solid transparent; }
.pill.ok { background: var(--ok-bg); color: var(--ok); }
.pill.warn { background: var(--warn-bg); color: var(--warn); }
.pill.bad { background: var(--bad-bg); color: var(--bad); }
.pill.info { background: var(--info-bg); color: var(--info); }

/* tables */
.tw { overflow: auto; }
table.t { width: 100%; border-collapse: collapse; font-size: 13px; }
table.t th { text-align: left; font: 600 12px/1 var(--sans); color: var(--muted); padding: 9px 12px; background: var(--panel-2); border-bottom: 1px solid var(--line); white-space: nowrap; position: sticky; top: 0; }
table.t td { padding: 8px 12px; border-bottom: 1px solid var(--line); vertical-align: top; max-width: 280px; overflow: hidden; text-overflow: ellipsis; }
table.t tr.data { cursor: pointer; }
table.t tr.data:hover td { background: var(--panel-2); }
table.t tr.sel td { background: var(--brass-soft); }
table.t td.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
table.t tr.detail td { background: var(--panel-2); max-width: none; white-space: normal; }
.idc { font-family: var(--mono); font-size: 12px; color: var(--muted); cursor: copy; }

/* key value */
.kv { display: grid; grid-template-columns: minmax(120px, 190px) 1fr; gap: 0; font-size: 13px; }
.kv > div { padding: 6px 0; border-bottom: 1px solid var(--line); word-break: break-word; }
.kv > .k { color: var(--muted); padding-right: 12px; }
.sub-kv { margin: 2px 0; padding: 2px 12px; border-left: 2px solid var(--line-2); }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; margin-bottom: 14px; }
.tile { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; }
.tile .l { font: 500 12px/1.2 var(--sans); color: var(--muted); }
.tile .v { font: 600 22px/1.25 var(--sans); margin-top: 6px; font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
.tile.gold { border-left: 3px solid var(--brand); }
.bar { height: 6px; background: var(--bg-2); border-radius: 3px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--brand); }

/* action cards */
.acts { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 8px; }
.act { text-align: left; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 9px 12px; cursor: pointer; display: flex; flex-direction: column; gap: 4px; }
.act:hover { border-color: var(--brand); }
.act .nm { font-weight: 500; font-size: 13px; }
.act .pt { font-family: var(--mono); font-size: 11.5px; color: var(--muted); word-break: break-all; }
.act .tg { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin-top: 2px; }
.grp { font: 600 12px/1 var(--sans); color: var(--muted); margin: 18px 0 8px; }

/* drawer */
.scrim { position: fixed; inset: 0; background: rgba(10, 14, 20, .4); z-index: 40; }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(620px, 100vw); background: var(--panel); z-index: 41; display: flex; flex-direction: column; box-shadow: var(--pop); border-left: 1px solid var(--line); }
.drawer > .dh { display: flex; gap: 10px; align-items: center; padding: 12px 18px; border-bottom: 1px solid var(--line); }
.drawer > .dh h2 { font-size: 16px; line-height: 1.3; }
.drawer > .db { overflow: auto; padding: 18px; flex: 1; }
.pathline { font-family: var(--mono); font-size: 12px; color: var(--muted); word-break: break-all; margin: 6px 0 12px; padding: 6px 8px; background: var(--panel-2); border: 1px solid var(--line); border-radius: 4px; }
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); margin: 14px 0 12px; }
.tabs button { background: none; border: none; padding: 6px 12px; cursor: pointer; color: var(--muted); font-weight: 500; border-bottom: 2px solid transparent; margin-bottom: -1px; }
.tabs button.on { color: var(--ink); border-bottom-color: var(--brand); }
pre.json { margin: 0; background: #0f141b; color: #d9e0ea; border-radius: 5px; padding: 12px 14px; overflow: auto; font: 12px/1.6 var(--mono); max-height: 460px; white-space: pre-wrap; word-break: break-word; }
.jk { color: #8fb4ff; } .js { color: #a5d6a7; } .jn { color: #f2c27b; } .jb { color: #ef9a9a; }
.resbar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; padding: 7px 12px; border-radius: 5px; background: var(--panel-2); border: 1px solid var(--line); margin-bottom: 10px; }
.sc { font-weight: 600; font-variant-numeric: tabular-nums; font-family: var(--mono); }
.sc.ok { color: var(--ok); } .sc.warn { color: var(--warn); } .sc.bad { color: var(--bad); }
.note { border: 1px solid var(--line); border-left: 3px solid var(--muted); background: var(--panel-2); color: var(--ink); padding: 8px 12px; border-radius: 4px; font-size: 13px; margin: 10px 0; }
.note.bad { border-left-color: var(--bad); background: var(--bad-bg); border-color: transparent; border-left-width: 3px; color: var(--bad); }
.note.info { border-left-color: var(--brand); background: var(--info-bg); border-color: transparent; color: var(--brass-ink); }
.note.ok { border-left-color: var(--ok); background: var(--ok-bg); border-color: transparent; color: var(--ok); }
.desc p { margin: 0 0 8px; }
.desc code { background: var(--bg-2); padding: 0 4px; border-radius: 3px; }

/* modal and toasts */
.modal { position: fixed; inset: 0; z-index: 60; display: grid; place-items: center; padding: 16px; background: rgba(10, 14, 20, .45); }
.modal > .box { width: min(520px, 100%); max-height: 90vh; overflow: auto; background: var(--panel); border-radius: 8px; box-shadow: var(--pop); border: 1px solid var(--line); }
.modal .box > .mh { padding: 12px 18px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 10px; }
.modal .box > .mb { padding: 18px; }
.toasts { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); z-index: 80; display: flex; flex-direction: column; gap: 8px; align-items: center; pointer-events: none; }
.toast { background: #1b212b; color: #fff; padding: 8px 14px; border-radius: 5px; box-shadow: var(--pop); font-size: 13px; max-width: 80vw; }
.toast.err { background: var(--bad); color: #fff; }
.toast.ok { background: #0c6b3b; }

/* sign in */
.signin { max-width: 400px; margin: 0 auto; display: block; border-radius: 8px; overflow: hidden; box-shadow: none; border: 1px solid var(--line); background: var(--panel); }
.signin .hero { display: none; }
.signin .form { background: var(--panel); padding: 28px; }
.wordmark { display: flex; align-items: center; gap: 10px; margin-bottom: 20px; }
.wordmark b { font-size: 16px; font-weight: 600; }
.preset { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }
.preset button { border: 1px solid var(--line-2); background: var(--panel); border-radius: 4px; padding: 3px 10px; cursor: pointer; font-size: 12.5px; }
.preset button:hover { border-color: var(--brand); color: var(--brand); }
.sess { display: flex; align-items: center; gap: 12px; padding: 11px 14px; border-bottom: 1px solid var(--line); }
.sess:last-child { border-bottom: none; }
.sess.on { background: var(--brass-soft); }
.av { width: 32px; height: 32px; border-radius: 50%; background: var(--bg-2); color: var(--ink); border: 1px solid var(--line-2); display: grid; place-items: center; font-weight: 600; font-size: 12.5px; flex: none; }
.steps { display: flex; flex-direction: column; }
.step { display: flex; gap: 14px; padding: 11px 0; border-bottom: 1px solid var(--line); align-items: flex-start; }
.step:last-child { border-bottom: none; }
.step .no { width: 24px; height: 24px; border-radius: 50%; border: 1px solid var(--line-2); display: grid; place-items: center; font-weight: 500; flex: none; font-size: 12px; color: var(--muted); }
.step.done .no { background: var(--ok); border-color: var(--ok); color: #fff; }
.step .tx { flex: 1; min-width: 0; }
.step .tx b { display: block; font-weight: 500; }
.step .tx span { color: var(--muted); font-size: 12.5px; }
.spin { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--line-2); border-top-color: var(--brand); animation: sp .7s linear infinite; display: inline-block; vertical-align: -2px; }
@keyframes sp { to { transform: rotate(360deg); } }
.logrow { display: grid; grid-template-columns: 60px 1fr auto; gap: 10px; align-items: center; padding: 8px 12px; border-bottom: 1px solid var(--line); cursor: pointer; }
.logrow:hover { background: var(--panel-2); }
.logrow .u { font-family: var(--mono); font-size: 12px; word-break: break-all; }
.logrow .s { font-size: 11.5px; color: var(--muted); }
.receipt { border: 1px solid var(--ok); border-left-width: 3px; border-radius: 5px; padding: 12px 16px; background: var(--ok-bg); }
.receipt h3 { color: var(--ok); font-size: 14px; }
.seg { display: inline-flex; border: 1px solid var(--line-2); border-radius: 5px; overflow: hidden; }
.seg button { background: var(--panel); border: none; padding: 5px 14px; cursor: pointer; font-weight: 500; font-size: 12.5px; color: var(--muted); }
.seg button.on { background: var(--brand); color: #fff; }
[data-theme="dark"] .seg button.on { color: #0a0d11; }

@media (max-width: 900px) {
  .app { grid-template-columns: 1fr; }
  .side { position: fixed; inset: 0 auto 0 0; width: 260px; z-index: 50; transform: translateX(-100%); transition: transform .2s; }
  .side.open { transform: none; box-shadow: var(--pop); }
  .menu-btn { display: inline-flex; }
  .content { padding: 16px 14px 60px; }
  .top, .ctxbar { padding-left: 14px; padding-right: 14px; }
  .cols2 { grid-template-columns: 1fr; }
  .kv { grid-template-columns: 110px 1fr; }
}
.signin form .btn[type=submit] { width: 100%; justify-content: center; padding: 8px 12px; }

/* id finder */
.idrow { display: flex; gap: 6px; align-items: flex-start; }
.idrow > .fld, .idrow > textarea { flex: 1; min-width: 0; }
.idrow > .btn { flex: none; align-self: flex-start; padding: 6px 10px; }
.picklist { max-height: 52vh; overflow: auto; border: 1px solid var(--line); border-radius: 5px; }
.picklist:empty { display: none; }
.pickrow { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-bottom: 1px solid var(--line); cursor: pointer; }
.pickrow:last-child { border-bottom: none; }
.pickrow:hover { background: var(--brass-soft); }
.pickrow .pm { flex: 1; min-width: 0; }

function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  if (attrs) for (const k in attrs) {
    const v = attrs[k];
    if (v == null || v === false) continue;
    if (k === 'class') el.className = v;
    else if (k === 'html') el.innerHTML = v;
    else if (k === 'style' && typeof v === 'object') Object.assign(el.style, v);
    else if (k.startsWith('on') && typeof v === 'function') el.addEventListener(k.slice(2), v);
    else if (k === 'value' || k === 'checked' || k === 'disabled' || k === 'selected') el[k] = v;
    else el.setAttribute(k, v === true ? '' : v);
  }
  const add = (c) => {
    if (c == null || c === false) return;
    if (Array.isArray(c)) c.forEach(add);
    else el.appendChild(c.nodeType ? c : document.createTextNode(String(c)));
  };
  kids.forEach(add);
  return el;
}

function ico(name, size) {
  const s = h('span', { class: 'ico-w', style: { display: 'inline-grid' } });
  s.innerHTML = '<svg class="ic" viewBox="0 0 24 24"' + (size ? ' style="width:' + size + 'px;height:' + size + 'px"' : '') + '>' + (ICONS[name] || ICONS.list) + '</svg>';
  return s;
}

function esc(s) { return String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }
function plain(s) {
  if (!s) return '';
  return String(s)
    .replace(/`?\{\{home_owner_token\}\}`?/g, 'a home owner session')
    .replace(/`?\{\{admin_token\}\}`?/g, 'an admin session')
    .replace(/`?\{\{token\}\}`?/g, 'the signed in session')
    .replace(/\{\{(\w+)\}\}/g, '$1');
}
function md(s) {
  return esc(plain(s)).replace(/`([^`]+)`/g, '<code>$1</code>').replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>');
}
function mdNode(s, tag) { return h(tag || 'div', { class: 'desc', html: md(s) }); }

function toast(msg, kind) {
  let box = $('#toasts');
  if (!box) { box = h('div', { class: 'toasts', id: 'toasts' }); document.body.appendChild(box); }
  const t = h('div', { class: 'toast ' + (kind || '') }, msg);
  box.appendChild(t);
  setTimeout(() => t.remove(), kind === 'err' ? 5200 : 2600);
}
function copyText(t) {
  const done = () => toast('Copied', 'ok');
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(done, () => toast('Copy blocked by the browser', 'err'));
  else { const a = h('textarea', { value: t }); document.body.appendChild(a); a.select(); try { document.execCommand('copy'); done(); } catch (e) { toast('Copy blocked', 'err'); } a.remove(); }
}

function money(n) {
  const v = Number(n);
  if (!isFinite(v)) return String(n);
  return (v < 0 ? '-' : '') + '$' + Math.abs(v).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}
const MONEY_KEY = /(amount|rent|deposit|balance|total|price|due|credit|arrears|paid|fee|cost|revenue|income|outstanding|charge)/i;
const NOT_MONEY = /(count|rate|percent|id$|number|date|days|months|period|status|currency|type|method|reference)/i;
function isMoneyKey(k) { return MONEY_KEY.test(k) && !NOT_MONEY.test(k); }

function statusClass(v) {
  const s = String(v).toUpperCase();
  if (/^(ACTIVE|PAID|COMPLETED|SUCCESS|OCCUPIED|HELD|REFUNDED|SENT|CONFIRMED|UP|OK|APPROVED|AVAILABLE|VERIFIED|RESOLVED|TRUE)$/.test(s)) return 'ok';
  if (/^(PENDING|SCHEDULED|ASSIGNED|IN_PROGRESS|PARTIAL|PARTIALLY_PAID|DRAFT|OPEN|PROCESSING|UNPAID|RESERVED|MAINTENANCE|VACANT|UNDER_MAINTENANCE)$/.test(s)) return 'warn';
  if (/^(OVERDUE|FAILED|CANCELLED|TERMINATED|EXPIRED|REJECTED|DOWN|ERROR|FALSE|BLACKLISTED|FROZEN|SUSPENDED|LATE)$/.test(s)) return 'bad';
  return 'info';
}

function jwt(token) {
  try {
    const p = token.split('.')[1].replace(/-/g, '+').replace(/_/g, '/');
    return JSON.parse(decodeURIComponent(escape(atob(p + '==='.slice((p.length + 3) % 4)))));
  } catch (e) { return null; }
}
const normRole = (r) => String(r || '').replace(/^ROLE_/, '').toUpperCase();

function persistSessions() { store.set('sessions', state.sessions); store.set('active', state.active); }
function activeSession() { return state.sessions.find((s) => s.id === state.active) || state.sessions[0] || null; }
function addSession(data, email) {
  const token = data.token || data.accessToken || data.access_token;
  if (!token) return null;
  const claims = jwt(token) || {};
  let roles = claims.roles || claims.authorities || data.roles || (data.role ? [data.role] : []);
  if (typeof roles === 'string') roles = [roles];
  roles = roles.map(normRole);
  if (data.role && !roles.includes(normRole(data.role))) roles.push(normRole(data.role));
  const exp = claims.exp ? claims.exp * 1000 : Date.now() + (Number(data.expiresIn) > 1e6 ? Number(data.expiresIn) : (Number(data.expiresIn) || 900) * 1000);

const refreshing = {};
async function rawFetch(url, opts) {
  const t0 = performance.now();
  try {
    const res = await fetch(url, opts);
    const text = await res.text();
    let data = null;
    try { data = text ? JSON.parse(text) : null; } catch (e) { data = null; }
    return { status: res.status, ok: res.ok, ms: Math.round(performance.now() - t0), data, text, ctype: res.headers.get('content-type') || '' };
  } catch (e) {
    return { status: 0, ok: false, ms: Math.round(performance.now() - t0), data: null, text: '', error: String(e && e.message || e), ctype: '' };
  }
}
async function refreshSession(sess) {

  if (refreshing[sess.id]) return refreshing[sess.id];
  refreshing[sess.id] = (async () => {
    const r = await rawFetch(state.cfg.auth.replace(/\/+$/, '') + '/auth/refresh', { method: 'POST', headers: { 'Content-Type': 'application/json', Accept: 'application/json' }, body: JSON.stringify({ refreshToken: sess.refreshToken }) });
    logEntry({ svc: 'auth', method: 'POST', url: state.cfg.auth + '/auth/refresh', reqBody: { refreshToken: '***' }, r, note: 'token refresh' });
    if (r.ok && r.data && (r.data.token || r.data.accessToken)) {
      const t = r.data.token || r.data.accessToken;
      const c = jwt(t) || {};
      sess.token = t;
      sess.refreshToken = r.data.refreshToken || sess.refreshToken;
      sess.exp = c.exp ? c.exp * 1000 : Date.now() + 15 * 60000;
      persistSessions();
      document.dispatchEvent(new CustomEvent('sess'));
      return true;
    }
    return false;
  })();

  return ok;
}
function logEntry(e) {

}
function buildUrl(svc, path, query) {
  let url = state.cfg[svc].replace(/\/+$/, '') + path;
  const qs = [];
  for (const k in (query || {})) if (query[k] !== '' && query[k] != null) qs.push(encodeURIComponent(k) + '=' + encodeURIComponent(query[k]));

}
async function call(o) {

  const url = buildUrl(svc, path, query);
  const headers = { Accept: 'application/json' };

  const send = async () => {
    if (session) {

      headers.Authorization = 'Bearer ' + session.token;
    }
    return rawFetch(url, { method, headers, body: body !== undefined && body !== null ? JSON.stringify(body) : undefined });
  };

    if (await refreshSession(session)) { headers.Authorization = 'Bearer ' + session.token; r = await rawFetch(url, { method, headers, body: body != null ? JSON.stringify(body) : undefined }); }
  }
  const masked = Object.assign({}, headers);

}

function explain(r) {

    return { kind: 'bad', text: 'Could not reach ' + where + '. Check that the service is running and the base URL in Settings is right.' + (location.protocol === 'file:' ? ' This page is open from a file, so the browser sends the origin "null", which the services block. Serve it over http on port 3000, 4200 or 5173 (for example: python3 -m http.server 3000).' : ' If the service is running, the browser may be blocking the call (CORS): this page must be served from an allowed origin such as http://localhost:3000, 4200 or 5173.') };
  }
  if (r.status === 401) return { kind: 'bad', text: (d.code === 'SESSION_EXPIRED' ? 'The session expired. ' : 'Authentication is required. ') + 'Sign in again from Accounts' + (d.code ? ' (' + d.code + ')' : '') + '.' };
  if (r.status === 403) return { kind: 'bad', text: 'Your role is not allowed to do this. ' + (msg ? msg + '. ' : '') + 'Owner endpoints need a home owner session and admin endpoints need an admin session.' };

  if (r.status >= 400) return { kind: 'bad', text: (msg || 'Request failed') + (d.code ? ' (' + d.code + ')' : '') };

}

  ctxEl.appendChild(h('span', { class: 'ctxchip', onclick: editAllCtx }, 'all ids'));
}
function editCtx(k) {
  const i = h('input', { class: 'fld', value: state.ctx[k] || '', placeholder: 'value' });
  const m = openModal(k, h('div', {}, h('div', { class: 'f' }, h('label', {}, 'Value saved for ' + k), withFinder(i, k)), h('div', { class: 'row' }, h('button', { class: 'btn', onclick: () => { ctxSet(k, i.value.trim()); m.remove(); } }, 'Save'), h('button', { class: 'btn ghost', onclick: () => { ctxSet(k, ''); m.remove(); } }, 'Clear'))));

}
function editAllCtx() {
  const ins = {}; const box = h('div');
  ALL_CTX.forEach((k) => { ins[k] = h('input', { class: 'fld', value: state.ctx[k] || '' }); box.appendChild(h('div', { class: 'f' }, h('label', {}, k), withFinder(ins[k], k))); });
  const m = openModal('All context ids', h('div', {}, box, h('div', { class: 'row' }, h('button', { class: 'btn', onclick: () => { Object.keys(ins).forEach((k) => { if ((state.ctx[k] || '') !== ins[k].value.trim()) ctxSet(k, ins[k].value.trim()); }); m.remove(); } }, 'Save'))));
}
function drawNav() {
  if (!navEl) return;
  const cur = (location.hash || '#/overview').slice(2);
  navEl.innerHTML = '';
  const item = (slug, name, icon, n) => h('a', { class: cur === slug ? 'on' : '', onclick: () => { $('.side').classList.remove('open'); go(slug); } }, ico(icon), name, n != null ? h('span', { class: 'n' }, String(n)) : null);
  navEl.appendChild(h('h4', {}, 'Start'));
  [['overview', 'Overview', 'home'], ['accounts', 'Accounts', 'user'], ['wallet', 'Wallet', 'wallet']].forEach((x) => navEl.appendChild(item(x[0], x[1], x[2])));
  navEl.appendChild(h('h4', {}, 'Property service'));
  SPEC.pages.forEach((p) => navEl.appendChild(item(p.slug, p.name, PAGE_ICON[p.name] || 'list', (PAGE_EP[p.name] || []).length)));
  navEl.appendChild(h('h4', {}, 'Tools'));
  [['all', 'All endpoints', 'list'], ['smoke', 'Smoke test', 'play'], ['log', 'Request log', 'clip'], ['settings', 'Settings', 'gear']].forEach((x) => navEl.appendChild(item(x[0], x[1], x[2])));
}
function route() {
  if (!contentEl) return;
  clearPageSubs(); closeDrawer();
  const slug = (location.hash || '#/overview').slice(2) || 'overview';
  let view;
  const pg = SPEC.pages.find((p) => p.slug === slug);
  if (pg) view = propertyPage(pg);
  else if (slug === 'accounts') view = accountsPage();
  else if (slug === 'wallet') view = walletPage();
  else if (slug === 'all') view = allPage();
  else if (slug === 'smoke') view = smokePage();
  else if (slug === 'log') view = logPage();
  else if (slug === 'settings') view = settingsPage();
  else view = overviewPage();

function renderApp() {
  document.documentElement.setAttribute('data-theme', state.theme);
  const root = $('#app'); root.innerHTML = '';
  if (!state.sessions.length && !state.guest) { navEl = topEl = ctxEl = contentEl = null; root.appendChild(signinScreen()); return; }
  navEl = h('div', { class: 'nav' }); topEl = h('div', { class: 'top' }); ctxEl = h('div', { class: 'ctxbar' }); contentEl = h('div', { class: 'content' });
  root.appendChild(h('div', { class: 'app' },
    h('aside', { class: 'side' }, h('div', { class: 'brandbar' }, h('div', { class: 'crest' }, ico('home', 16)), h('div', {}, h('b', {}, 'Premisave'), h('small', {}, 'Property console'))), navEl, h('div', { class: 'sidefoot' }, h('span', {}, 'Property service client'))),
    h('div', { class: 'main' }, topEl, ctxEl, contentEl)));
  drawTop(); drawCtx(); route();
}
document.addEventListener('ctx', drawCtx);
document.addEventListener('sess', drawTop);
document.addEventListener('log', drawTop);
document.addEventListener('health', drawTop);
window.addEventListener('hashchange', () => { if (contentEl) route(); });
document.addEventListener('sess', () => { if (!state.sessions.length && !state.guest) renderApp(); });
window.__pc = { state, call, ALL, route, renderApp, go, openEndpoint, ctxSet, addSession };
renderApp();
pingAll();
setInterval(() => document.dispatchEvent(new CustomEvent('sess')), 60000);
