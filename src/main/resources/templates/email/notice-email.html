<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="color-scheme" content="light dark"/>
  <meta name="supported-color-schemes" content="light dark"/>
  <title th:text="${subject}">Premisave</title>
  <th:block th:replace="~{email/fragments :: styles}"></th:block>
</head>
<body class="bg" style="margin:0;padding:0;background-color:#EEEAFB;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Helvetica,Arial,sans-serif;color:#3D3A63;">
  <div style="display:none;max-height:0;overflow:hidden;opacity:0;mso-hide:all;font-size:1px;line-height:1px;color:#EEEAFB;"><span th:text="${subject}">Preview text</span>&#847;&zwnj;&nbsp;&#847;&zwnj;&nbsp;&#847;&zwnj;&nbsp;&#847;&zwnj;&nbsp;&#847;&zwnj;&nbsp;&#847;&zwnj;&nbsp;&#847;&zwnj;&nbsp;&#847;&zwnj;&nbsp;&#847;&zwnj;&nbsp;&#847;&zwnj;&nbsp;&#847;&zwnj;&nbsp;&#847;&zwnj;&nbsp;&#847;&zwnj;&nbsp;&#847;&zwnj;&nbsp;&#847;&zwnj;&nbsp;&#847;&zwnj;&nbsp;&#847;&zwnj;&nbsp;&#847;&zwnj;&nbsp;&#847;&zwnj;&nbsp;&#847;&zwnj;&nbsp;&#847;&zwnj;&nbsp;&#847;&zwnj;&nbsp;&#847;&zwnj;&nbsp;&#847;&zwnj;&nbsp;&#847;&zwnj;&nbsp;&#847;&zwnj;&nbsp;&#847;&zwnj;&nbsp;&#847;&zwnj;&nbsp;&#847;&zwnj;&nbsp;&#847;&zwnj;&nbsp;</div>
  <table role="presentation" class="bg" width="100%" cellpadding="0" cellspacing="0" style="background-color:#EEEAFB;">
    <tr>
      <td class="outer" align="center" style="padding:32px 14px;">
        <table role="presentation" class="container card" width="600" cellpadding="0" cellspacing="0" style="width:600px;max-width:100%;background-color:#FFFFFF;border-radius:22px;overflow:hidden;box-shadow:0 10px 40px rgba(58,49,181,0.14);">

          <tr th:replace="~{email/fragments :: header}"></tr>
          <tr>
            <td class="px card" style="padding:38px 36px 36px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:15px;line-height:1.65;color:#3D3A63;background-color:#FFFFFF;">

                <table role="presentation" cellpadding="0" cellspacing="0" style="margin:0 0 18px;">
                  <tr><td class="ring" style="background-color:#EAE7FF;border-radius:999px;padding:6px 14px;font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:#4A3FDB;" th:text="${noticeType}"><span class="ring-t">Notice</span></td></tr>
                </table>
                <h1 class="h1 ink" style="margin:0 0 6px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:29px;line-height:1.18;font-weight:800;letter-spacing:-0.9px;color:#15123A;overflow-wrap:anywhere;word-break:break-word;" th:text="${subject}">Notice subject</h1>
                <p class="mu" style="margin:0 0 20px;font-size:13px;line-height:1.5;color:#7A77A3;">Sent <span th:text="${sentAt}">date</span></p>
                <p class="tx" style="margin:0 0 16px;font-size:15.5px;line-height:1.65;color:#3D3A63;">Hi <span th:text="${tenantName}">there</span>,</p>
                <table role="presentation" class="info" width="100%" cellpadding="0" cellspacing="0" style="margin:6px 0 22px;background-color:#EEEBFF;border:1px solid #D9D4FA;border-radius:14px;">
                  <tr>
                    <td width="5" style="width:5px;background-color:#4A3FDB;border-radius:14px 0 0 14px;font-size:0;line-height:0;">&nbsp;</td>
                    <td class="info-t" style="padding:16px 18px;font-size:15px;line-height:1.7;color:#2F2A80;word-break:break-word;" th:utext="${content}">Notice content goes here.</td>
                  </tr>
                </table>
                <table role="presentation" cellpadding="0" cellspacing="0" style="margin:8px 0 8px;" align="left">
                  <tr>
                    <td class="btn-td" align="center" bgcolor="#4A3FDB" style="background-color:#4A3FDB;border-radius:14px;box-shadow:0 6px 16px rgba(74,63,219,0.30);">
                      <a class="btn-a" th:href="${appUrl}" href="#" style="display:inline-block;padding:16px 34px;font-size:16px;line-height:1.2;font-weight:700;letter-spacing:0.1px;color:#FFFFFF;text-decoration:none;">Open Premisave</a>
                    </td>
                  </tr>
                </table>
                <div style="clear:both;"></div>

            </td>
          </tr>
          <tr th:replace="~{email/fragments :: footer}"></tr>
        </table>
        <table role="presentation" class="container" width="600" cellpadding="0" cellspacing="0" style="width:600px;max-width:100%;">
          <tr><td class="px mu" align="center" style="padding:18px 20px 0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:12px;line-height:1.6;color:#7A77A3;">Sent by premisave &middot; Find a place. Trust the people behind it.</td></tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
