<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <meta name="color-scheme" content="light"/>
    <meta name="supported-color-schemes" content="light"/>
    <title th:text="${subject}">Notice</title>
    <style>
        @media only screen and (max-width: 620px) {
            .container { width: 100% !important; border-radius: 0 !important; }
            .px { padding-left: 20px !important; padding-right: 20px !important; }
        }
    </style>
</head>
<!--
  Owner-written notices (rent reminders, lease renewals, move-out, maintenance, general).
  Variables: tenantName, subject, noticeType, sentAt, content (already HTML-escaped, with
  <br/> line breaks — hence th:utext below) plus the shared brandName/supportEmail/year/appUrl.
-->
<body style="margin:0; padding:0; background-color:#F5F0E8; font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif; -webkit-text-size-adjust:100%;">

<div style="display:none; max-height:0; overflow:hidden; opacity:0; color:transparent; mso-hide:all;"
     th:text="${subject}">Notice</div>

<table role="presentation" width="100%" cellpadding="0" cellspacing="0" bgcolor="#F5F0E8"
       style="background-color:#F5F0E8; padding:28px 12px;">
    <tr>
        <td align="center">
            <table role="presentation" class="container" width="600" cellpadding="0" cellspacing="0"
                   style="width:600px; max-width:600px; background-color:#ffffff; border-radius:12px; overflow:hidden; border:1px solid #E8E0CF;">

                <tr th:replace="~{email/fragments :: header}"></tr>

                <!-- Notice type badge -->
                <tr>
                    <td class="px" style="padding:28px 32px 0 32px;">
                        <span style="display:inline-block; background-color:#F6EEDC; color:#8A6D1F; font-size:11px; font-weight:700; letter-spacing:1px; text-transform:uppercase; padding:5px 11px; border-radius:999px; border:1px solid #E9D9AE;"
                              th:text="${noticeType}">Notice</span>
                    </td>
                </tr>

                <!-- Subject -->
                <tr>
                    <td class="px" style="padding:14px 32px 0 32px;">
                        <h1 style="margin:0; color:#1A1A1A; font-size:22px; font-weight:700; line-height:1.3;"
                            th:text="${subject}">Notice subject</h1>
                        <p style="margin:6px 0 0 0; color:#6B7A76; font-size:13px;">
                            Sent <span th:text="${sentAt}">date</span>
                        </p>
                    </td>
                </tr>

                <!-- Greeting + body -->
                <tr>
                    <td class="px" style="padding:20px 32px 0 32px; color:#3D4A47; font-size:15px; line-height:1.7;">
                        <p style="margin:0 0 14px 0;">Hi <span th:text="${tenantName}">there</span>,</p>
                        <div style="padding:16px 18px; background-color:#FAF7F0; border-left:4px solid #C9A84C; border-radius:6px;"
                             th:utext="${content}">Notice content goes here.</div>
                    </td>
                </tr>

                <!-- Button -->
                <tr>
                    <td class="px" style="padding:26px 32px 0 32px;">
                        <table role="presentation" cellpadding="0" cellspacing="0">
                            <tr>
                                <td bgcolor="#1A3C34" style="background-color:#1A3C34; border-radius:8px;">
                                    <a th:href="${appUrl}" href="#"
                                       style="display:inline-block; padding:13px 26px; color:#F5F0E8; font-size:14px; font-weight:700; text-decoration:none; border-radius:8px; letter-spacing:0.3px;">Open Premisave</a>
                                </td>
                            </tr>
                        </table>
                    </td>
                </tr>

                <tr><td style="padding:0 0 32px 0; font-size:0; line-height:0;">&nbsp;</td></tr>

                <tr th:replace="~{email/fragments :: footer}"></tr>

            </table>
        </td>
    </tr>
</table>
</body>
</html>
