spring:
  application:
    name: premisave-property-management-service

  mongodb:
    uri: ${MONGODB_URI:mongodb://localhost:27017/premisave-property}

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      repositories:
        enabled: false

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:thepeacemakerske@gmail.com}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          # Explicit timeouts so a slow/unreachable SMTP server fails fast
          # instead of hanging the thread that's sending the email. All in
          # milliseconds. Without these, the JavaMail defaults are
          # effectively "wait forever" on some JVMs/socket configs.
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
        transport:
          protocol: smtp

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    listener:
      simple:
        default-requeue-rejected: false

  servlet:
    multipart:
      enabled: true
      max-file-size: 20MB
      max-request-size: 50MB

server:
  port: 8085

# JWT Configuration
jwt:
  secret: ${JWT_SECRET:}
  expiration: 86400000   # 24 hours

# External Microservices
auth-service:
  url: ${AUTH_SERVICE_URL:http://localhost:8080}

wallet-service:
  url: ${WALLET_SERVICE_URL:http://localhost:8084}

listing-service:
  url: ${LISTING_SERVICE_URL:http://localhost:8082}

booking-service:
  url: ${BOOKING_SERVICE_URL:http://localhost:8083}

# Availability checks for the services this one depends on. Endpoints marked @RequiresServices
# answer 503 "service offline" up-front when auth-service / wallet-service can't be reached.
# Any HTTP answer from the health path counts as online (except 502/503/504), so a missing or
# protected path is fine. Set enabled=false to switch the checks off.
service-health:
  enabled: ${SERVICE_HEALTH_CHECKS_ENABLED:true}
  auth:
    path: ${AUTH_SERVICE_HEALTH_PATH:/health}
  wallet:
    path: ${WALLET_SERVICE_HEALTH_PATH:/system/health}

# Internal API Key (must match Auth Service)
app:
  api-key: ${INTERNAL_API_KEY:}

# Frontend
frontend:
  url: ${FRONTEND_URL:http://localhost:3000}

# Notice delivery
notifications:
  email:
    from: ${NOTICE_EMAIL_FROM:no-reply@premisave.com}
    # Display name on the From line and in the email header/footer.
    from-name: ${NOTICE_EMAIL_FROM_NAME:Premisave}
    # Shown in every email footer as the "Questions?" contact.
    support-address: ${SUPPORT_EMAIL:support@premisave.com}

# Utility billing rates (USD charged per unit of metered consumption).
# these were KES amounts before the currency moved to USD (wallets are USD).
# 20 and 200 would now mean USD 20 per kWh — set real USD rates via the env vars.
utility:
  rates:
    electricity: ${UTILITY_RATE_ELECTRICITY:20}
    water: ${UTILITY_RATE_WATER:200}

# ── Logging ──
logging:
  level:
    "[com.premisave.property]": DEBUG
    "[org.springframework.cloud.openfeign]": DEBUG
    "[org.springframework.data.mongodb]": INFO
    "[org.springframework.amqp]": WARN
    # Mutes SpringDoc's one-time "enabled by default" boot reminders for /v3/api-docs and
    # /swagger-ui.html — those endpoints keep working, only the log line goes away.
    "[org.springdoc]": ERROR